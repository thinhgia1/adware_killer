name: CI Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with Buildozer
        uses: kivy/buildozer-action@v0.3.0
        with:
          filename: buildozer.spec
          release: false

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-apk
          path: bin/*.apk
