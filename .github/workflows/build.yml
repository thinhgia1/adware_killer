name: CI Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git zip unzip openjdk-17-jdk \
          python3-pip autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev \
          cmake libffi-dev libssl-dev libltdl-dev \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

    - name: Install Buildozer & Cython
      run: |
        pip install --upgrade pip
        pip install --user Cython==0.29.36 buildozer
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Force stable settings in buildozer.spec
      run: |
        # Ép Python + Kivy ổn định
        sed -i 's/^requirements =.*/requirements = python3==3.11.9,kivy==2.3.0,pyjnius/' buildozer.spec || true
        
        # Các cấu hình quan trọng
        for key in "android.accept_sdk_license = True" "log_level = 2" "android.ndk = 25b" "android.api = 34" "android.minapi = 24" "android.build_tools_version = 34.0.0"; do
          key_name=$(echo $key | cut -d= -f1 | xargs)
          if grep -q "^$key_name" buildozer.spec; then
            sed -i "s|^$key_name.*|$key|" buildozer.spec
          else
            echo "$key" >> buildozer.spec
          fi
        done

    - name: Clean previous build
      run: |
        buildozer android clean || true
        rm -rf .buildozer

    - name: Build APK with Buildozer
      run: buildozer -v android debug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: package-apk
        path: bin/*.apk
        if-no-files-found: error
