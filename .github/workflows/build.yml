name: CI Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git zip unzip openjdk-17-jdk \
          python3-pip autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev \
          cmake libffi-dev libssl-dev libltdl-dev

    - name: Install Buildozer & Cython
      run: |
        pip install --upgrade pip
        pip install --user Cython==0.29.36 buildozer
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Enable auto-accept Android licenses
      run: |
        # Tự động bật android.accept_sdk_license = True
        if grep -q "android.accept_sdk_license" buildozer.spec; then
          sed -i 's/.*android.accept_sdk_license.*/android.accept_sdk_license = True/' buildozer.spec
        else
          echo "android.accept_sdk_license = True" >> buildozer.spec
        fi

    - name: Build APK with Buildozer
      run: buildozer -v android debug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: package-apk
        path: bin/*.apk
